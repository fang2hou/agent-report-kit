name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install the toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Install dependencies (pnpm)
        run: pnpm install
      - name: Validate (mise run check)
        run: mise run check
