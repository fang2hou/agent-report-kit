[tools]
node = "24"
pnpm = "12"
prek = "latest"
cocogitto = "latest"

[tasks.lint]
run = "pnpm lint"

[tasks.format]
run = "pnpm exec oxfmt --check ."

[tasks.typecheck]
run = "pnpm check"

[tasks.validate]
run = "node tools/validate.ts"

[tasks.check]
depends = ["lint", "format", "typecheck", "validate"]
